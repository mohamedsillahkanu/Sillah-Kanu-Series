<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICF-SL Digital Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary: #004080;
      --primary-dark: #003060;
      --primary-light: #0060a0;
      --accent: #ffc107;
      --accent-dark: #e0a800;
      --white: #ffffff;
      --gray-100: #f0f4f8;
      --gray-200: #e2e8f0;
      --gray-600: #475569;
      --gray-800: #1e293b;
      --success: #28a745;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Oswald', Arial, sans-serif;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #000;
      font-weight: 500;
    }
    
    /* Header */
    .header {
      background: var(--primary);
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 15px;
    }
    
    .header-brand {
      display: flex;
      align-items: center;
      gap: 15px;
      color: white;
    }
    
    .logo-box {
      background: white;
      border-radius: 8px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo-box img {
      width: 45px;
      height: 45px;
      border-radius: 6px;
      object-fit: cover;
    }
    
    .header-text h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    
    .header-text p {
      font-size: 0.75rem;
      font-weight: 400;
      opacity: 0.9;
      font-style: italic;
    }
    
    /* Search Bar */
    .search-container {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 400px;
      min-width: 200px;
    }
    
    .search-box {
      flex: 1;
      position: relative;
    }
    
    .search-input {
      width: 100%;
      padding: 12px 45px 12px 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 25px;
      background: rgba(255,255,255,0.1);
      color: white;
      font-family: 'Oswald', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }
    
    .search-input::placeholder {
      color: rgba(255,255,255,0.6);
    }
    
    .search-input:focus {
      background: rgba(255,255,255,0.2);
      border-color: var(--accent);
    }
    
    .search-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--accent);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    
    .search-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-50%) scale(1.1);
    }
    
    .search-btn svg {
      width: 16px;
      height: 16px;
      stroke: #000;
    }
    
    /* Search Results Dropdown */
    .search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border-radius: 12px;
      margin-top: 8px;
      max-height: 350px;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: none;
      z-index: 200;
    }
    
    .search-results.active {
      display: block;
    }
    
    .search-result-item {
      padding: 12px 18px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      transition: background 0.2s;
    }
    
    .search-result-item:hover {
      background: var(--gray-100);
    }
    
    .search-result-item:last-child {
      border-bottom: none;
    }
    
    .result-title {
      font-weight: 600;
      color: var(--primary);
      font-size: 0.95rem;
    }
    
    .result-section {
      font-size: 0.8rem;
      color: var(--gray-600);
      margin-top: 2px;
    }
    
    .result-type {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-left: 8px;
    }
    
    .result-type.book {
      background: #e3f2fd;
      color: #1565c0;
    }
    
    .result-type.section {
      background: #fff3e0;
      color: #e65100;
    }
    
    .no-results {
      padding: 20px;
      text-align: center;
      color: var(--gray-600);
    }
    
    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    
    .btn {
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Oswald', Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 2px solid transparent;
    }
    
    .btn-outline {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.5);
      color: white;
    }
    
    .btn-outline:hover {
      background: rgba(255,255,255,0.15);
      border-color: white;
    }
    
    .btn-gold {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }
    
    .btn-gold:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }
    
    /* Main Content */
    .main {
      padding: 25px 30px;
      min-height: calc(100vh - 100px);
    }
    
    /* Section Navigation */
    .section-nav {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      background: rgba(0,64,128,0.3);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid rgba(0,64,128,0.5);
    }
    
    .section-nav-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid var(--accent);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }
    
    .section-nav-btn:hover:not(:disabled) {
      background: var(--primary-light);
      transform: scale(1.1);
    }
    
    .section-nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    
    .section-nav-btn svg {
      width: 20px;
      height: 20px;
    }
    
    .section-tabs {
      display: flex;
      gap: 10px;
      flex: 1;
      overflow-x: auto;
      padding: 5px 0;
      scrollbar-width: none;
    }
    
    .section-tabs::-webkit-scrollbar {
      display: none;
    }
    
    .section-tab {
      padding: 12px 24px;
      background: rgba(255,255,255,0.1);
      border: 2px solid transparent;
      border-radius: 25px;
      color: white;
      font-family: 'Oswald', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .section-tab:hover {
      background: rgba(255,255,255,0.2);
    }
    
    .section-tab.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    
    .section-tab .tab-icon {
      font-size: 1.1rem;
    }
    
    .section-tab .tab-count {
      background: rgba(0,0,0,0.2);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
    }
    
    .section-tab.active .tab-count {
      background: rgba(0,0,0,0.15);
    }
    
    /* Section Header */
    .section-header {
      background: var(--primary);
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .section-icon {
      font-size: 2rem;
    }
    
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    
    .section-subtitle {
      font-size: 0.85rem;
      font-weight: 400;
      opacity: 0.9;
    }
    
    /* Bookshelf */
    .bookshelf-container {
      perspective: 1500px;
    }
    
    .bookshelf {
      background: 
        radial-gradient(circle at center, #3a4050 1.5px, transparent 1.5px);
      background-size: 10px 10px;
      background-color: #1e2028;
      border-radius: 16px;
      padding: 0;
      position: relative;
      box-shadow: 
        0 30px 80px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.05);
      border: 1px solid #2a2d35;
      overflow: hidden;
    }
    
    .bookshelf::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(0,212,255,0.03) 0%, transparent 60%);
      pointer-events: none;
      z-index: 1;
    }
    
    .shelf-row {
      display: flex;
      gap: 35px;
      padding: 40px 50px 55px;
      min-height: 300px;
      align-items: flex-end;
      justify-content: flex-start;
      position: relative;
      flex-wrap: wrap;
      z-index: 2;
    }
    
    .shelf-row::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(180deg, #35393f 0%, #25282e 30%, #1a1c20 70%, #0f1012 100%);
      border-top: 1px solid #45494f;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.08), 0 -15px 40px rgba(0,0,0,0.4);
    }
    
    .shelf-row::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 60px;
      right: 60px;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, #00ccff 10%, #00ffff 50%, #00ccff 90%, transparent 100%);
      border-radius: 3px;
      box-shadow: 0 0 8px #00ddff, 0 0 15px #00ddff, 0 0 30px rgba(0,221,255,0.6);
      z-index: 10;
    }
    
    .empty-shelf-message {
      width: 100%;
      text-align: center;
      color: rgba(0,200,255,0.5);
      font-size: 1.1rem;
      padding: 80px 40px;
      font-style: italic;
    }
    
    /* Book */
    .book {
      position: relative;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      filter: drop-shadow(0 8px 15px rgba(0,0,0,0.6));
      animation: bookAppear 0.5s ease-out backwards;
    }
    
    @keyframes bookAppear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    .book:hover {
      transform: translateY(-15px) scale(1.05);
      z-index: 10;
      filter: drop-shadow(0 20px 35px rgba(0,0,0,0.7));
    }
    
    .book:hover .book-info {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    
    .book:hover .book-front {
      box-shadow: 0 0 20px rgba(0,200,255,0.3), 0 0 40px rgba(0,200,255,0.15), 4px 4px 15px rgba(0,0,0,0.5);
    }
    
    .book-3d {
      position: relative;
      transform-style: preserve-3d;
    }
    
    .book-front {
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 4px 4px 15px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.1);
      background: var(--primary);
      transition: box-shadow 0.3s ease;
      position: relative;
    }
    
    .book-front img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .book-front-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.3) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.15) 100%);
      pointer-events: none;
    }
    
    .book-pages-edge {
      position: absolute;
      top: 3px;
      bottom: 3px;
      right: -10px;
      width: 10px;
      background: linear-gradient(90deg, #f5f5f0 0%, #e8e8e3 30%, #f0f0eb 50%, #e5e5e0 80%, #d8d8d3 100%);
      border-radius: 0 2px 2px 0;
      box-shadow: 2px 0 4px rgba(0,0,0,0.2);
    }
    
    .book-pages-edge::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 3px);
    }
    
    /* Book Info Tooltip */
    .book-info {
      position: absolute;
      top: -90px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: #2a2d35;
      color: white;
      padding: 15px 18px;
      border-radius: 8px;
      width: 200px;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 20;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      border: 1px solid #3a3d45;
    }
    
    .book-info h4 {
      font-size: 0.9rem;
      margin-bottom: 5px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }
    
    .book-info p {
      font-size: 0.75rem;
      opacity: 0.7;
      font-weight: 400;
      color: #ccc;
    }
    
    .book-info .book-meta {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 0.7rem;
      color: rgba(0,200,255,0.8);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .book-info::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid #2a2d35;
    }
    
    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    
    .loading-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255,193,7,0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: white;
      margin-top: 20px;
      font-size: 1.1rem;
    }
    
    /* Notification */
    .notification {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 15px 30px;
      border-radius: 8px;
      font-weight: 600;
      z-index: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      border: 2px solid;
    }
    
    .notification.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    
    .notification.success {
      background: #d4edda;
      color: #155724;
      border-color: var(--success);
    }
    
    .notification.error {
      background: #f8d7da;
      color: #721c24;
      border-color: #dc3545;
    }
    
    .notification.info {
      background: #e7f3ff;
      color: var(--primary);
      border-color: var(--primary);
    }
    
    /* Footer */
    .footer {
      background: var(--primary);
      color: white;
      padding: 20px 40px;
      text-align: center;
      font-size: 0.9rem;
    }
    
    .footer p {
      margin: 5px 0;
      opacity: 0.9;
    }
    
    /* ==================== READER STYLES ==================== */
    .reader-view {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    
    .reader-view.active {
      opacity: 1;
      pointer-events: all;
    }
    
    .reader-header {
      background: var(--primary);
      padding: 12px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    
    .reader-title {
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
    }
    
    .reader-title span {
      font-weight: 400;
      opacity: 0.8;
      margin-left: 10px;
      font-size: 0.9rem;
    }
    
    .reader-controls {
      display: flex;
      gap: 10px;
    }
    
    .flipbook-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: visible;
    }
    
    .book-3d-wrapper {
      perspective: 2500px;
      overflow: visible;
    }
    
    .flipbook {
      display: flex;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(3deg);
      overflow: visible;
    }
    
    .flipbook-page {
      width: 480px;
      height: 640px;
      background: white;
      position: relative;
      overflow: visible;
      z-index: 5;
    }
    
    .flipbook-page-left {
      border-radius: 8px 0 0 8px;
      box-shadow: inset -30px 0 60px rgba(0,0,0,0.1), -10px 15px 50px rgba(0,0,0,0.4);
    }
    
    .flipbook-page-left canvas { border-radius: 8px 0 0 8px; }
    
    .flipbook-page-right {
      border-radius: 0 8px 8px 0;
      box-shadow: inset 30px 0 60px rgba(0,0,0,0.05), 10px 15px 50px rgba(0,0,0,0.4);
    }
    
    .flipbook-page-right canvas { border-radius: 0 8px 8px 0; }
    
    .flipbook-page canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: white;
      position: relative;
      z-index: 2;
    }
    
    .book-spine-center {
      width: 35px;
      background: linear-gradient(90deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 15%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.1) 85%, rgba(0,0,0,0.3) 100%);
      box-shadow: inset 0 0 25px rgba(0,0,0,0.25);
      position: relative;
      z-index: 6;
      align-self: stretch;
    }
    
    .page-number {
      position: absolute;
      bottom: 15px;
      font-size: 0.85rem;
      color: var(--gray-600);
      font-weight: 500;
    }
    
    .flipbook-page-left .page-number { left: 20px; }
    .flipbook-page-right .page-number { right: 20px; }
    
    /* Page Stacks */
    .page-stack-left, .page-stack-right {
      position: absolute;
      top: 0;
      bottom: 0;
      pointer-events: none;
      transition: width 0.3s ease;
      z-index: 1;
    }
    
    .page-stack-left { right: 100%; }
    .page-stack-right { left: 100%; }
    
    .stack-page {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #f5f5f0, #fff, #f8f8f5);
      box-shadow: 0 0 1px rgba(0,0,0,0.1);
    }
    
    .page-stack-left .stack-page {
      right: 0;
      left: auto;
      border-radius: 4px 0 0 4px;
      border-left: 1px solid #e0e0dc;
    }
    
    .page-stack-right .stack-page {
      left: 0;
      right: auto;
      border-radius: 0 4px 4px 0;
      border-right: 1px solid #e0e0dc;
    }
    
    .stack-edge {
      position: absolute;
      top: 3px;
      bottom: 3px;
      background: repeating-linear-gradient(180deg, #f8f8f5 0px, #f8f8f5 1px, #e8e8e3 1px, #e8e8e3 2px);
      z-index: 100;
    }
    
    .stack-edge-left {
      right: 0;
      border-radius: 2px 0 0 2px;
      box-shadow: inset 2px 0 4px rgba(0,0,0,0.15), -2px 0 8px rgba(0,0,0,0.1);
    }
    
    .stack-edge-right {
      left: 0;
      border-radius: 0 2px 2px 0;
      box-shadow: inset -2px 0 4px rgba(0,0,0,0.15), 2px 0 8px rgba(0,0,0,0.1);
    }
    
    /* Page Flip Animation */
    .page-flip-container {
      position: absolute;
      top: 0;
      width: 480px;
      height: 640px;
      transform-style: preserve-3d;
      z-index: 50;
      pointer-events: none;
      display: none;
    }
    
    .page-flip-container.flip-forward {
      left: calc(480px + 17px);
      transform-origin: left center;
    }
    
    .page-flip-container.flip-backward {
      left: 0;
      transform-origin: right center;
    }
    
    .page-flip-container.flipping-forward {
      display: block;
      animation: flipForward 0.6s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
    }
    
    .page-flip-container.flipping-backward {
      display: block;
      animation: flipBackward 0.6s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
    }
    
    @keyframes flipForward {
      0% { transform: rotateY(0deg) scale(1); }
      40% { transform: rotateY(-70deg) scale(1.02); }
      100% { transform: rotateY(-180deg) scale(1); }
    }
    
    @keyframes flipBackward {
      0% { transform: rotateY(0deg) scale(1); }
      40% { transform: rotateY(70deg) scale(1.02); }
      100% { transform: rotateY(180deg) scale(1); }
    }
    
    .flip-page-front, .flip-page-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background: white;
      overflow: hidden;
    }
    
    .flip-page-front {
      border-radius: 0 8px 8px 0;
      box-shadow: -5px 0 30px rgba(0,0,0,0.2);
    }
    
    .flip-page-back {
      transform: rotateY(180deg);
      border-radius: 8px 0 0 8px;
      box-shadow: 5px 0 30px rgba(0,0,0,0.2);
    }
    
    .flip-backward .flip-page-front {
      border-radius: 8px 0 0 8px;
      box-shadow: 5px 0 30px rgba(0,0,0,0.2);
    }
    
    .flip-backward .flip-page-back {
      transform: rotateY(-180deg);
      border-radius: 0 8px 8px 0;
      box-shadow: -5px 0 30px rgba(0,0,0,0.2);
    }
    
    .flip-page-front canvas, .flip-page-back canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    /* Navigation Arrows */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 60px;
      height: 60px;
      background: var(--primary);
      border: 3px solid var(--accent);
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 5px 25px rgba(0,64,128,0.5);
      z-index: 20;
    }
    
    .nav-arrow:hover:not(:disabled) {
      background: var(--primary-light);
      transform: translateY(-50%) scale(1.1);
    }
    
    .nav-arrow:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    
    .nav-arrow svg { width: 28px; height: 28px; }
    .nav-prev { left: 25px; }
    .nav-next { right: 25px; }
    
    /* Page Indicator */
    .page-indicator {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 25px;

      width: 120px;
      height: 5px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    
    /* Page Click Zones */
    .page-click-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 25%;
      cursor: pointer;
      z-index: 10;
    }
    
    .page-click-left { left: 0; }
    .page-click-right { right: 0; }
    
    /* Thumbnails Sidebar */
    .thumbnails-sidebar {
      position: fixed;

      bottom: 0;

    }

    }
    
    .thumbnails-grid {
      flex: 1;

    }
    
    .thumbnail {

    }
    
    .thumbnail:hover { border-color: var(--accent); transform: scale(1.05); }
    .thumbnail.active { border-color: var(--accent); box-shadow: 0 0 15px rgba(255,193,7,0.5); }
    
    .thumbnail canvas {

    .thumbnail-num {

    }
    
    /* Responsive */
    @media (max-width: 1100px) {
      .flipbook-page { width: 380px; height: 510px; }
      .page-flip-container { width: 380px; height: 510px; }
      .page-flip-container.flip-forward { left: calc(380px + 17px); }

  </style>

  <script>
    // ============================================
    // LIBRARY CONFIGURATION - ADD YOUR BOOKS HERE
    // ============================================
    
    const libraryData = {
      sections: [
        {
          id: 'all',
          name: 'All Books',
          icon: '📚',
          description: 'Browse all publications'
        },
        {
          id: 'health',
          name: 'Health & Medicine',

          books: [

            },
            {

            }
          ]
        },
        {

            {
              title: 'Statistics Fundamentals',

            }
          ]
        },
        {

          icon: '📖',
          description: 'Language and communication resources',
          books: [
            {
              title: 'Technical Writing Guide',
              url: 'https://github.com/user/repo/raw/main/books/tech-writing.pdf',
              pages: 55
            }
          ]
        },
        {
          id: 'technology',
          name: 'Technology',
          icon: '💻',
          description: 'IT and software resources',
          books: [
            {
              title: 'Web Development Basics',
              url: 'https://github.com/user/repo/raw/main/books/web-dev.pdf',
              pages: 110
            }
          ]
        }
      ]
    };
    
    // ============================================
    // STATE VARIABLES
    // ============================================
    
    let currentSectionIndex = 0;
    let currentBooks = [];
    let loadedBooks = {};
    let currentBook = null;
    let currentPdf = null;
    let currentPages = [];
    let totalPages = 0;
    let currentSpread = 0;
    let isFlipping = false;
    let thumbnailsOpen = false;
    let soundEnabled = true;
    
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    // ============================================
    // AUDIO ENGINE
    // ============================================
    
    const audioEngine = {
      ctx: null,
      initialized: false,
      
      init() {
        if (this.initialized) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.initialized = true;
      },
      
      playPageTurn() {
        if (!soundEnabled || !this.ctx) return;
        
        const now = this.ctx.currentTime;
        
        // Whoosh sound
        const noise = this.ctx.createBufferSource();
        const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.3, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < buffer.length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (buffer.length * 0.15));
        }
        noise.buffer = buffer;
        
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.exponentialRampToValueAtTime(2000, now + 0.15);
        filter.Q.value = 1;
        
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
        noise.stop(now + 0.3);
      }
    };
    
    // ============================================
    // INITIALIZATION
    // ============================================
    
    document.addEventListener('DOMContentLoaded', () => {
      initLibrary();
      
      // Click outside search to close
      document.addEventListener('click', (e) => {
        const searchBox = document.querySelector('.search-box');
        if (!searchBox.contains(e.target)) {
          document.getElementById('searchResults').classList.remove('active');
        }
      });
      
      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (document.getElementById('readerView').classList.contains('active')) {
          if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
          if (e.key === 'ArrowLeft') prevPage();
          if (e.key === 'Escape') closeReader();
        }
      });
    });
    
    function initLibrary() {
      renderSectionTabs();
      loadSection(0);
      updateSectionNavButtons();
    }
    
    // ============================================
    // SECTION MANAGEMENT
    // ============================================
    
    function renderSectionTabs() {
      const container = document.getElementById('sectionTabs');
      container.innerHTML = libraryData.sections.map((section, index) => `
        <button class="section-tab ${index === 0 ? 'active' : ''}" onclick="loadSection(${index})">
          <span class="tab-icon">${section.icon}</span>
          <span>${section.name}</span>
          <span class="tab-count">${getSectionBookCount(section)}</span>
        </button>
      `).join('');
    }
    
    function getSectionBookCount(section) {
      if (section.id === 'all') {
        return libraryData.sections.reduce((sum, s) => sum + (s.books ? s.books.length : 0), 0);
      }
      return section.books ? section.books.length : 0;
    }
    
    function loadSection(index) {
      currentSectionIndex = index;
      const section = libraryData.sections[index];
      
      // Update tabs
      document.querySelectorAll('.section-tab').forEach((tab, i) => {
        tab.classList.toggle('active', i === index);
      });
      
      // Update header
      document.getElementById('sectionIcon').textContent = section.icon;
      document.getElementById('sectionTitle').textContent = section.name;
      
      // Get books for section
      if (section.id === 'all') {
        currentBooks = [];
        libraryData.sections.forEach(s => {
          if (s.books) {
            s.books.forEach(book => {
              currentBooks.push({ ...book, section: s.name, sectionIcon: s.icon });
            });
          }
        });
      } else {
        currentBooks = (section.books || []).map(book => ({
          ...book,
          section: section.name,
          sectionIcon: section.icon
        }));
      }
      
      document.getElementById('sectionSubtitle').textContent = 
        `${currentBooks.length} publication${currentBooks.length !== 1 ? 's' : ''}`;
      
      renderBookshelf();
      updateSectionNavButtons();
      
      // Scroll tabs to show active
      const activeTab = document.querySelector('.section-tab.active');
      if (activeTab) {
        activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }
    
    function prevSection() {
      if (currentSectionIndex > 0) {
        loadSection(currentSectionIndex - 1);
      }
    }
    
    function nextSection() {
      if (currentSectionIndex < libraryData.sections.length - 1) {
        loadSection(currentSectionIndex + 1);
      }
    }
    
    function updateSectionNavButtons() {
      document.getElementById('prevSectionBtn').disabled = currentSectionIndex === 0;
      document.getElementById('nextSectionBtn').disabled = currentSectionIndex === libraryData.sections.length - 1;
    }
    
    // ============================================
    // SEARCH FUNCTIONALITY
    // ============================================
    
    function handleSearch(query) {
      if (!query.trim()) {
        document.getElementById('searchResults').classList.remove('active');
        return;
      }
      
      const results = [];
      const q = query.toLowerCase();
      
      // Search sections
      libraryData.sections.forEach((section, sIndex) => {
        if (section.name.toLowerCase().includes(q)) {
          results.push({
            type: 'section',
            title: section.name,
            icon: section.icon,
            index: sIndex
          });
        }
        
        // Search books
        if (section.books) {
          section.books.forEach((book, bIndex) => {
            if (book.title.toLowerCase().includes(q)) {
              results.push({
                type: 'book',
                title: book.title,
                section: section.name,
                sectionIndex: sIndex,
                bookIndex: bIndex,
                icon: section.icon
              });
            }
          });
        }
      });
      
      renderSearchResults(results, query);
    }
    
    function renderSearchResults(results, query) {
      const container = document.getElementById('searchResults');
      
      if (results.length === 0) {
        container.innerHTML = `<div class="no-results">No results found for "${query}"</div>`;
      } else {
        container.innerHTML = results.map(result => {
          if (result.type === 'section') {
            return `
              <div class="search-result-item" onclick="goToSection(${result.index})">
                <span class="result-title">${result.icon} ${result.title}</span>
                <span class="result-type section">Section</span>
              </div>
            `;
          } else {
            return `
              <div class="search-result-item" onclick="goToBook(${result.sectionIndex}, ${result.bookIndex})">
                <div class="result-title">${result.title}<span class="result-type book">Book</span></div>
                <div class="result-section">${result.icon} ${result.section}</div>
              </div>
            `;
          }
        }).join('');
      }
      
      container.classList.add('active');
    }
    
    function showSearchResults() {
      const query = document.getElementById('searchInput').value;
      if (query.trim()) {
        handleSearch(query);
      }
    }
    
    function performSearch() {
      const query = document.getElementById('searchInput').value;
      handleSearch(query);
    }
    
    function goToSection(index) {
      document.getElementById('searchResults').classList.remove('active');
      document.getElementById('searchInput').value = '';
      loadSection(index);
    }
    
    function goToBook(sectionIndex, bookIndex) {
      document.getElementById('searchResults').classList.remove('active');
      document.getElementById('searchInput').value = '';
      loadSection(sectionIndex);
      
      // Wait for render then open book
      setTimeout(() => {
        openBook(bookIndex);
      }, 300);
    }
    
    // ============================================
    // BOOKSHELF RENDERING
    // ============================================
    
    function renderBookshelf() {
      const bookshelf = document.getElementById('bookshelf');
      
      if (currentBooks.length === 0) {
        bookshelf.innerHTML = `
          <div class="shelf-row">
            <div class="empty-shelf-message">No books in this section yet</div>
          </div>
          <div class="shelf-row"></div>
        `;
        return;
      }
      
      // Organize books into rows
      const booksPerRow = 5;
      const rows = [];
      for (let i = 0; i < currentBooks.length; i += booksPerRow) {
        rows.push(currentBooks.slice(i, i + booksPerRow));
      }
      
      while (rows.length < 2) rows.push([]);
      
      bookshelf.innerHTML = rows.map((rowBooks, rowIndex) => {
        const booksHtml = rowBooks.map((book, bookIndex) => {
          const globalIndex = rowIndex * booksPerRow + bookIndex;
          const height = 190;
          const width = 130;
          const depth = Math.min(25, 8 + ((book.pages || 50) * 0.12));
          
          // Generate cover color based on title
          const hue = (book.title.charCodeAt(0) * 15) % 360;
          const coverStyle = book.coverUrl 
            ? `background-image: url('${book.coverUrl}'); background-size: cover;`
            : `background: linear-gradient(135deg, hsl(${hue}, 60%, 40%) 0%, hsl(${hue}, 70%, 25%) 100%);`;
          
          return `
            <div class="book" onclick="openBook(${globalIndex})" style="animation-delay: ${globalIndex * 0.08}s">
              <div class="book-3d">
                <div class="book-front" style="width: ${width}px; height: ${height}px; ${coverStyle}">
                  ${!book.coverUrl ? `<div style="padding: 15px; color: white; font-size: 0.85rem; font-weight: 600; line-height: 1.3; height: 100%; display: flex; align-items: center; text-align: center;">${book.title}</div>` : ''}
                  <div class="book-front-overlay"></div>
                </div>
                <div class="book-pages-edge" style="height: ${height - 6}px; width: ${depth}px;"></div>
              </div>
              <div class="book-info">
                <h4>${book.title}</h4>
                <p>${book.sectionIcon} ${book.section}</p>
                <div class="book-meta">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                  </svg>
                  Click to read
                </div>
              </div>
            </div>
          `;
        }).join('');
        
        return `<div class="shelf-row">${booksHtml}</div>`;
      }).join('');
    }
    
    // ============================================
    // BOOK READER
    // ============================================
    
    async function openBook(index) {
      const book = currentBooks[index];
      if (!book || !book.url) {
        showNotification('Book URL not configured', 'error');
        return;
      }
      
      audioEngine.init();
      showLoading('Loading book...');
      
      try {
        // Fetch PDF from GitHub
        const response = await fetch(book.url);
        if (!response.ok) throw new Error('Failed to fetch PDF');
        
        const arrayBuffer = await response.arrayBuffer();
        const dataCopy = arrayBuffer.slice(0);
        
        currentPdf = await pdfjsLib.getDocument({ data: dataCopy }).promise;
        totalPages = currentPdf.numPages;
        currentSpread = 0;
        currentPages = [];
        currentBook = book;
        
        // Pre-render all pages
        for (let i = 1; i <= totalPages; i++) {
          const page = await currentPdf.getPage(i);
          currentPages.push(page);
        }
        
        document.getElementById('readerTitle').innerHTML = `${book.title} <span>${totalPages} pages</span>`;
        document.getElementById('totalPagesDisplay').textContent = totalPages;
        
        await generateThumbnails();
        await renderSpread();
        updatePageStacks();
        
        document.getElementById('readerView').classList.add('active');
        hideLoading();
      } catch (err) {
        console.error('Error opening book:', err);
        hideLoading();
        showNotification('Error loading book. Check URL configuration.', 'error');
      }
    }
    
    // ============================================
    // VIRTUAL PAGE MAPPING
    // ============================================
    
    function getVirtualTotal() {
      return totalPages + 2 + (totalPages % 2);
    }
    
    function virtualToActual(vPos) {
      const N = totalPages;
      if (vPos === 0) return -1;
      if (vPos === 1) return 0;
      
      if (N % 2 === 0) {
        if (vPos <= N) return vPos - 1;
        return -1;
      } else {
        if (vPos <= N - 1) return vPos - 1;
        if (vPos === N) return -1;
        if (vPos === N + 1) return N - 1;
        return -1;
      }
    }
    
    function getMaxSpread() {
      return (getVirtualTotal() / 2) - 1;
    }
    
    // ============================================
    // PAGE RENDERING
    // ============================================
    
    async function renderPage(page, canvas) {
      const scale = 1.5;
      const viewport = page.getViewport({ scale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      
      await page.render({
        canvasContext: canvas.getContext('2d'),
        viewport
      }).promise;
    }
    
    function renderBlankPage(canvas) {
      canvas.width = 480;
      canvas.height = 640;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 480, 640);
      gradient.addColorStop(0, '#fafafa');
      gradient.addColorStop(0.5, '#f5f5f5');
      gradient.addColorStop(1, '#efefef');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 480, 640);
      ctx.strokeStyle = 'rgba(0,0,0,0.02)';
      for (let y = 20; y < 640; y += 25) {
        ctx.beginPath();
        ctx.moveTo(40, y);
        ctx.lineTo(440, y);
        ctx.stroke();
      }
      canvas.style.display = 'block';
    }
    
    async function renderSpread() {
      const leftPage = document.getElementById('leftPage');
      const rightPage = document.getElementById('rightPage');
      const leftCanvas = document.getElementById('leftCanvas');
      const rightCanvas = document.getElementById('rightCanvas');
      const leftPageNum = document.getElementById('leftPageNum');
      const rightPageNum = document.getElementById('rightPageNum');
      
      const leftVirtual = currentSpread * 2;
      const rightVirtual = currentSpread * 2 + 1;
      
      const leftIdx = virtualToActual(leftVirtual);
      const rightIdx = virtualToActual(rightVirtual);
      
      // Left page
      if (leftIdx >= 0 && leftIdx < totalPages) {
        leftPage.style.visibility = 'visible';
        leftCanvas.style.display = 'block';
        await renderPage(currentPages[leftIdx], leftCanvas);
        leftPageNum.textContent = leftIdx + 1;
        leftPageNum.style.display = 'block';
      } else {
        leftPage.style.visibility = 'visible';
        renderBlankPage(leftCanvas);
        leftPageNum.style.display = 'none';
      }
      
      // Right page
      if (rightIdx >= 0 && rightIdx < totalPages) {
        rightPage.style.visibility = 'visible';
        rightCanvas.style.display = 'block';
        await renderPage(currentPages[rightIdx], rightCanvas);
        rightPageNum.textContent = rightIdx + 1;
        rightPageNum.style.display = 'block';
      } else {
        rightPage.style.visibility = 'visible';
        renderBlankPage(rightCanvas);
        rightPageNum.style.display = 'none';
      }
      
      // Update indicators
      let displayText;
      if (currentSpread === 0) {
        displayText = 'Cover';
      } else if (leftIdx >= 0 && rightIdx < 0) {
        displayText = `${leftIdx + 1}`;
      } else if (leftIdx >= 0 && rightIdx >= 0) {
        displayText = `${leftIdx + 1}-${rightIdx + 1}`;
      } else {
        displayText = '-';
      }
      document.getElementById('currentPageDisplay').textContent = displayText;
      
      const maxActualShown = Math.max(leftIdx, rightIdx);
      const progress = ((maxActualShown + 1) / totalPages) * 100;
      document.getElementById('progressFill').style.width = `${Math.min(Math.max(progress, 0), 100)}%`;
      
      document.getElementById('prevBtn').disabled = currentSpread === 0;
      document.getElementById('nextBtn').disabled = currentSpread >= getMaxSpread();
      
      updateActiveThumbnail();
      updatePageStacks();
    }
    
    // ============================================
    // PAGE STACKS
    // ============================================
    
    function updatePageStacks() {
      const leftVirtual = currentSpread * 2;
      const rightVirtual = currentSpread * 2 + 1;
      
      let pagesOnLeft = 0;
      let pagesOnRight = 0;
      
      for (let v = 0; v < leftVirtual; v++) {
        if (virtualToActual(v) >= 0) pagesOnLeft++;
      }
      
      const virtualTotal = getVirtualTotal();
      for (let v = rightVirtual + 1; v < virtualTotal; v++) {
        if (virtualToActual(v) >= 0) pagesOnRight++;
      }
      
      const pageThickness = 2;
      const maxStackWidth = 80;
      
      // Left stack
      const leftStack = document.getElementById('pageStackLeft');
      const leftThickness = Math.min(pagesOnLeft * pageThickness, maxStackWidth);
      leftStack.innerHTML = '';
      leftStack.style.width = leftThickness + 'px';
      
      if (pagesOnLeft > 0) {
        const numLayers = Math.min(Math.ceil(pagesOnLeft / 3), 15);
        for (let i = 0; i < numLayers; i++) {
          const page = document.createElement('div');
          page.className = 'stack-page';
          const offset = (numLayers - i - 1) * (leftThickness / numLayers);
          page.style.transform = `translateX(${offset}px)`;
          page.style.zIndex = i;
          const shade = 250 - (i % 3) * 3;
          page.style.background = `linear-gradient(90deg, rgb(${shade-5},${shade-5},${shade-10}) 0%, rgb(${shade},${shade},${shade}) 50%, rgb(${shade-3},${shade-3},${shade-8}) 100%)`;
          leftStack.appendChild(page);
        }
        
        const edgeDiv = document.createElement('div');
        edgeDiv.className = 'stack-edge stack-edge-left';
        edgeDiv.style.width = leftThickness + 'px';
        leftStack.appendChild(edgeDiv);
      }
      
      // Right stack
      const rightStack = document.getElementById('pageStackRight');
      const rightThickness = Math.min(pagesOnRight * pageThickness, maxStackWidth);
      rightStack.innerHTML = '';
      rightStack.style.width = rightThickness + 'px';
      
      if (pagesOnRight > 0) {
        const numLayers = Math.min(Math.ceil(pagesOnRight / 3), 15);
        for (let i = 0; i < numLayers; i++) {
          const page = document.createElement('div');
          page.className = 'stack-page';
          const offset = (numLayers - i - 1) * (rightThickness / numLayers);
          page.style.transform = `translateX(-${offset}px)`;
          page.style.zIndex = i;
          const shade = 250 - (i % 3) * 3;
          page.style.background = `linear-gradient(90deg, rgb(${shade-3},${shade-3},${shade-8}) 0%, rgb(${shade},${shade},${shade}) 50%, rgb(${shade-5},${shade-5},${shade-10}) 100%)`;
          rightStack.appendChild(page);
        }
        
        const edgeDiv = document.createElement('div');
        edgeDiv.className = 'stack-edge stack-edge-right';
        edgeDiv.style.width = rightThickness + 'px';
        rightStack.appendChild(edgeDiv);
      }
    }
    
    // ============================================
    // PAGE NAVIGATION
    // ============================================
    
    async function nextPage() {
      if (isFlipping || currentSpread >= getMaxSpread()) return;
      
      isFlipping = true;
      audioEngine.playPageTurn();
      
      const flipContainer = document.getElementById('flipForwardContainer');
      const flipFront = document.getElementById('flipForwardFront');
      const flipBack = document.getElementById('flipForwardBack');
      
      const currentRightVirtual = currentSpread * 2 + 1;
      const nextLeftVirtual = (currentSpread + 1) * 2;
      
      const currentRightIdx = virtualToActual(currentRightVirtual);
      const nextLeftIdx = virtualToActual(nextLeftVirtual);
      
      if (currentRightIdx >= 0 && currentRightIdx < totalPages) {
        await renderPage(currentPages[currentRightIdx], flipFront);
      } else {
        renderBlankPage(flipFront);
      }
      
      if (nextLeftIdx >= 0 && nextLeftIdx < totalPages) {
        await renderPage(currentPages[nextLeftIdx], flipBack);
      } else {
        renderBlankPage(flipBack);
      }
      
      flipContainer.classList.add('flipping-forward');
      
      setTimeout(async () => {
        flipContainer.classList.remove('flipping-forward');
        currentSpread++;
        await renderSpread();
        isFlipping = false;
      }, 600);
    }
    
    async function prevPage() {
      if (isFlipping || currentSpread === 0) return;
      
      isFlipping = true;
      audioEngine.playPageTurn();
      
      const flipContainer = document.getElementById('flipBackwardContainer');
      const flipFront = document.getElementById('flipBackwardFront');
      const flipBack = document.getElementById('flipBackwardBack');
      
      const currentLeftVirtual = currentSpread * 2;
      const prevRightVirtual = (currentSpread - 1) * 2 + 1;
      
      const currentLeftIdx = virtualToActual(currentLeftVirtual);
      const prevRightIdx = virtualToActual(prevRightVirtual);
      
      if (currentLeftIdx >= 0 && currentLeftIdx < totalPages) {
        await renderPage(currentPages[currentLeftIdx], flipFront);
      } else {
        renderBlankPage(flipFront);
      }
      
      if (prevRightIdx >= 0 && prevRightIdx < totalPages) {
        await renderPage(currentPages[prevRightIdx], flipBack);
      } else {
        renderBlankPage(flipBack);
      }
      
      flipContainer.classList.add('flipping-backward');
      
      setTimeout(async () => {
        flipContainer.classList.remove('flipping-backward');
        currentSpread--;
        await renderSpread();
        isFlipping = false;
      }, 600);
    }
    
    async function goToPage(pageIndex) {
      if (isFlipping) return;
      
      let targetSpread = 0;
      
      for (let s = 0; s <= getMaxSpread(); s++) {
        const leftIdx = virtualToActual(s * 2);
        const rightIdx = virtualToActual(s * 2 + 1);
        if (leftIdx === pageIndex || rightIdx === pageIndex) {
          targetSpread = s;
          break;
        }
      }
      
      if (targetSpread !== currentSpread) {
        audioEngine.playPageTurn();
        currentSpread = targetSpread;
        await renderSpread();
      }
      toggleThumbnails();
    }
    
    // ============================================
    // THUMBNAILS
    // ============================================
    
    async function generateThumbnails() {
      const grid = document.getElementById('thumbnailsGrid');
      grid.innerHTML = '';
      
      for (let i = 0; i < totalPages; i++) {
        const thumb = document.createElement('div');
        thumb.className = 'thumbnail';
        thumb.dataset.page = i;
        thumb.onclick = () => goToPage(i);
        
        const canvas = document.createElement('canvas');
        thumb.appendChild(canvas);
        
        const numLabel = document.createElement('div');
        numLabel.className = 'thumbnail-num';
        if (i === 0) {
          numLabel.textContent = 'Cover';
        } else if (i === totalPages - 1) {
          numLabel.textContent = `Page ${i + 1} (Last)`;
        } else {
          numLabel.textContent = `Page ${i + 1}`;
        }
        thumb.appendChild(numLabel);
        
        grid.appendChild(thumb);
        
        const page = currentPages[i];
        const viewport = page.getViewport({ scale: 0.2 });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        
        await page.render({
          canvasContext: canvas.getContext('2d'),
          viewport
        }).promise;
      }
    }
    
    function updateActiveThumbnail() {
      const thumbs = document.querySelectorAll('.thumbnail');
      const leftIdx = virtualToActual(currentSpread * 2);
      const rightIdx = virtualToActual(currentSpread * 2 + 1);
      
      thumbs.forEach((thumb, i) => {
        thumb.classList.toggle('active', i === leftIdx || i === rightIdx);
      });
    }
    
    // ============================================
    // UI CONTROLS
    // ============================================
    
    function closeReader() {
      document.getElementById('readerView').classList.remove('active');
      document.getElementById('thumbnailsSidebar').classList.remove('open');
      thumbnailsOpen = false;
      currentBook = null;
      currentPdf = null;
      currentPages = [];
    }
    
    function toggleThumbnails() {
      thumbnailsOpen = !thumbnailsOpen;
      document.getElementById('thumbnailsSidebar').classList.toggle('open', thumbnailsOpen);
    }
    
    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundOnIcon').style.display = soundEnabled ? 'block' : 'none';
      document.getElementById('soundLabel').textContent = soundEnabled ? 'Sound' : 'Muted';
    }
    
    function showLoading(text) {
      document.getElementById('loadingText').textContent = text;
      document.getElementById('loadingOverlay').classList.add('active');
    }
    
    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('active');
    }
    
    function showNotification(message, type = 'info') {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.className = `notification ${type} show`;
      setTimeout(() => notif.classList.remove('show'), 3000);
    }
  </script>
</body>
