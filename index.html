<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICF-SL Digital Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary: #004080;
      --primary-dark: #003060;
      --primary-light: #0060a0;
      --accent: #ffc107;
      --accent-dark: #e0a800;
      --gray-100: #f0f4f8;
      --gray-600: #475569;
      --gray-800: #1e293b;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Oswald', Arial, sans-serif;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
    }
    
    .header {
      background: var(--primary);
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 15px;
    }
    
    .header-brand { display: flex; align-items: center; gap: 15px; color: white; }
    .logo-box { background: white; border-radius: 8px; padding: 6px; }
    .logo-box img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; }
    .header-text h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 1px; }
    .header-text p { font-size: 0.75rem; opacity: 0.9; font-style: italic; }
    
    .search-container { display: flex; flex: 1; max-width: 400px; min-width: 200px; }
    .search-box { flex: 1; position: relative; }
    .search-input {
      width: 100%;
      padding: 12px 45px 12px 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 25px;
      background: rgba(255,255,255,0.1);
      color: white;
      font-family: 'Oswald', sans-serif;
      font-size: 0.95rem;
      outline: none;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.6); }
    .search-input:focus { background: rgba(255,255,255,0.2); border-color: var(--accent); }
    .search-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: var(--accent); border: none; border-radius: 50%;
      width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .search-btn svg { width: 16px; height: 16px; stroke: #000; }
    
    .search-results {
      position: absolute; top: 100%; left: 0; right: 0;
      background: white; border-radius: 12px; margin-top: 8px;
      max-height: 350px; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: none; z-index: 200;
    }
    .search-results.active { display: block; }
    .search-result-item { padding: 12px 18px; cursor: pointer; border-bottom: 1px solid #eee; }
    .search-result-item:hover { background: var(--gray-100); }
    .result-title { font-weight: 600; color: var(--primary); }
    .result-section { font-size: 0.8rem; color: var(--gray-600); margin-top: 2px; }
    .result-type { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; margin-left: 8px; }
    .result-type.book { background: #e3f2fd; color: #1565c0; }
    .result-type.section { background: #fff3e0; color: #e65100; }
    .no-results { padding: 20px; text-align: center; color: var(--gray-600); }
    
    .header-actions { display: flex; gap: 10px; }
    .btn {
      padding: 10px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; font-family: 'Oswald', sans-serif; text-transform: uppercase;
      transition: all 0.3s ease; display: flex; align-items: center; gap: 6px; border: 2px solid transparent;
    }
    .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.5); color: white; }
    .btn-outline:hover { background: rgba(255,255,255,0.15); border-color: white; }
    .btn-gold { background: var(--accent); border-color: var(--accent); color: #000; }
    .btn-gold:hover { background: var(--accent-dark); }
    
    .main { padding: 25px 30px; min-height: calc(100vh - 100px); }
    
    .section-nav {
      display: flex; align-items: center; gap: 15px; margin-bottom: 25px;
      background: rgba(0,64,128,0.3); padding: 15px 20px; border-radius: 12px; border: 1px solid rgba(0,64,128,0.5);
    }
    .section-nav-btn {
      width: 45px; height: 45px; border-radius: 50%; background: var(--primary);
      border: 2px solid var(--accent); color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;
    }
    .section-nav-btn:hover:not(:disabled) { background: var(--primary-light); transform: scale(1.1); }
    .section-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .section-nav-btn svg { width: 20px; height: 20px; }
    .section-tabs { display: flex; gap: 10px; flex: 1; overflow-x: auto; padding: 5px 0; scrollbar-width: none; }
    .section-tabs::-webkit-scrollbar { display: none; }
    .section-tab {
      padding: 12px 24px; background: rgba(255,255,255,0.1); border: 2px solid transparent;
      border-radius: 25px; color: white; font-family: 'Oswald', sans-serif; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.3s ease;
      display: flex; align-items: center; gap: 8px;
    }
    .section-tab:hover { background: rgba(255,255,255,0.2); }
    .section-tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .tab-count { background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; }
    .section-tab.active .tab-count { background: rgba(0,0,0,0.15); }
    
    .section-header {
      background: var(--primary); color: white; padding: 15px 25px; border-radius: 8px;
      display: flex; align-items: center; gap: 15px; margin-bottom: 20px;
    }
    .section-icon { font-size: 2rem; }
    .section-title { font-size: 1.3rem; font-weight: 700; text-transform: uppercase; }
    .section-subtitle { font-size: 0.85rem; opacity: 0.9; }
    
    .bookshelf {
      background: radial-gradient(circle at center, #3a4050 1.5px, transparent 1.5px);
      background-size: 10px 10px; background-color: #1e2028; border-radius: 16px;
      position: relative; box-shadow: 0 30px 80px rgba(0,0,0,0.8); border: 1px solid #2a2d35;
    }
    .shelf-row {
      display: flex; gap: 35px; padding: 40px 50px 55px; min-height: 300px;
      align-items: flex-end; flex-wrap: wrap; position: relative; z-index: 2;
    }
    .shelf-row::before {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
      background: linear-gradient(180deg, #35393f 0%, #25282e 30%, #1a1c20 70%, #0f1012 100%);
      border-top: 1px solid #45494f;
    }
    .shelf-row::after {
      content: ''; position: absolute; bottom: 2px; left: 60px; right: 60px; height: 3px;
      background: linear-gradient(90deg, transparent 0%, #00ccff 10%, #00ffff 50%, #00ccff 90%, transparent 100%);
      border-radius: 3px; box-shadow: 0 0 8px #00ddff, 0 0 15px #00ddff; z-index: 10;
    }
    .empty-shelf-message {
      width: 100%; text-align: center; color: rgba(0,200,255,0.5);
      font-size: 1.1rem; padding: 80px 40px; font-style: italic;
    }
    
    .book {
      position: relative; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 8px 15px rgba(0,0,0,0.6));
    }
    .book:hover { transform: translateY(-15px) scale(1.05); z-index: 10; }
    .book:hover .book-info { opacity: 1; transform: translateX(-50%) translateY(0); }
    .book:hover .book-front { box-shadow: 0 0 20px rgba(0,200,255,0.3), 0 0 40px rgba(0,200,255,0.15); }
    .book-front {
      width: 130px; height: 190px; border-radius: 4px; overflow: hidden;
      box-shadow: 4px 4px 15px rgba(0,0,0,0.4); background: var(--primary); position: relative;
    }
    .book-front img { width: 100%; height: 100%; object-fit: cover; }
    .book-front-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.3) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.15) 100%);
    }
    .book-pages-edge {
      position: absolute; top: 3px; bottom: 3px; right: -12px; width: 12px;
      background: linear-gradient(90deg, #f5f5f0, #e8e8e3, #f0f0eb, #e5e5e0, #d8d8d3);
      border-radius: 0 2px 2px 0; box-shadow: 2px 0 4px rgba(0,0,0,0.2);
    }
    .book-pages-edge::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 3px);
    }
    .book-info {
      position: absolute; top: -85px; left: 50%; transform: translateX(-50%) translateY(-10px);
      background: #2a2d35; color: white; padding: 12px 15px; border-radius: 8px; width: 180px;
      opacity: 0; transition: all 0.3s ease; pointer-events: none; z-index: 20;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .book-info h4 { font-size: 0.85rem; font-weight: 600; line-height: 1.3; }
    .book-info p { font-size: 0.75rem; opacity: 0.7; margin-top: 5px; }
    .book-info::after {
      content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
      border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 8px solid #2a2d35;
    }
    
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .loading-overlay.active { opacity: 1; pointer-events: all; }
    .loading-spinner {
      width: 60px; height: 60px; border: 4px solid rgba(255,193,7,0.3);
      border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: white; margin-top: 20px; font-size: 1.1rem; }
    
    .notification {
      position: fixed; top: 100px; left: 50%; transform: translateX(-50%) translateY(-20px);
      padding: 15px 30px; border-radius: 8px; font-weight: 600; z-index: 600;
      opacity: 0; pointer-events: none; transition: all 0.3s ease; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }
    .notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .notification.success { background: #d4edda; color: #155724; }
    .notification.error { background: #f8d7da; color: #721c24; }
    .notification.info { background: #e7f3ff; color: var(--primary); }
    
    .footer { background: var(--primary); color: white; padding: 20px 40px; text-align: center; font-size: 0.9rem; }
    .footer p { margin: 5px 0; opacity: 0.9; }
    
    /* Reader */
    .reader-view {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      z-index: 200; display: flex; flex-direction: column;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    .reader-view.active { opacity: 1; pointer-events: all; }
    .reader-header { background: var(--primary); padding: 12px 25px; display: flex; align-items: center; justify-content: space-between; }
    .reader-title { color: white; font-size: 1.1rem; font-weight: 700; }
    .reader-title span { font-weight: 400; opacity: 0.8; margin-left: 10px; font-size: 0.9rem; }
    .reader-controls { display: flex; gap: 10px; }
    .flipbook-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; }
    .book-3d-wrapper { perspective: 2500px; }
    .flipbook { display: flex; position: relative; transform-style: preserve-3d; transform: rotateX(3deg); }
    .flipbook-page { width: 480px; height: 640px; background: white; position: relative; overflow: visible; z-index: 5; }
    .flipbook-page-left { border-radius: 8px 0 0 8px; box-shadow: inset -30px 0 60px rgba(0,0,0,0.1), -10px 15px 50px rgba(0,0,0,0.4); }
    .flipbook-page-right { border-radius: 0 8px 8px 0; box-shadow: inset 30px 0 60px rgba(0,0,0,0.05), 10px 15px 50px rgba(0,0,0,0.4); }
    .flipbook-page canvas { width: 100%; height: 100%; object-fit: contain; background: white; }
    .flipbook-page-left canvas { border-radius: 8px 0 0 8px; }
    .flipbook-page-right canvas { border-radius: 0 8px 8px 0; }
    .book-spine-center { width: 35px; background: linear-gradient(90deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 15%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.1) 85%, rgba(0,0,0,0.3) 100%); z-index: 6; }
    .page-number { 
      position: absolute; 
      bottom: 20px; 
      font-size: 0.9rem; 
      color: #555; 
      font-weight: 600; 
      background: rgba(255,255,255,0.9);
      padding: 6px 14px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 15;
    }
    .flipbook-page-left .page-number { left: 20px; }
    .flipbook-page-right .page-number { right: 20px; }
    .page-stack-left, .page-stack-right { position: absolute; top: 0; bottom: 0; pointer-events: none; transition: width 0.3s ease; z-index: 1; }
    .page-stack-left { right: 100%; }
    .page-stack-right { left: 100%; }
    .stack-edge { position: absolute; top: 3px; bottom: 3px; background: repeating-linear-gradient(180deg, #f8f8f5 0px, #f8f8f5 1px, #e8e8e3 1px, #e8e8e3 2px); z-index: 100; }
    .stack-edge-left { right: 0; box-shadow: inset 2px 0 4px rgba(0,0,0,0.15); }
    .stack-edge-right { left: 0; box-shadow: inset -2px 0 4px rgba(0,0,0,0.15); }
    .page-flip-container { position: absolute; top: 0; width: 480px; height: 640px; transform-style: preserve-3d; z-index: 50; pointer-events: none; display: none; }
    .page-flip-container.flip-forward { left: calc(480px + 17px); transform-origin: left center; }
    .page-flip-container.flip-backward { left: 0; transform-origin: right center; }
    .page-flip-container.flipping-forward { display: block; animation: flipForward 0.6s cubic-bezier(0.4, 0.0, 0.2, 1) forwards; }
    .page-flip-container.flipping-backward { display: block; animation: flipBackward 0.6s cubic-bezier(0.4, 0.0, 0.2, 1) forwards; }
    @keyframes flipForward { 0% { transform: rotateY(0deg); } 40% { transform: rotateY(-70deg); } 100% { transform: rotateY(-180deg); } }
    @keyframes flipBackward { 0% { transform: rotateY(0deg); } 40% { transform: rotateY(70deg); } 100% { transform: rotateY(180deg); } }
    .flip-page-front, .flip-page-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: white; }
    .flip-page-front { border-radius: 0 8px 8px 0; box-shadow: -5px 0 30px rgba(0,0,0,0.2); }
    .flip-page-back { transform: rotateY(180deg); border-radius: 8px 0 0 8px; box-shadow: 5px 0 30px rgba(0,0,0,0.2); }
    .flip-backward .flip-page-front { border-radius: 8px 0 0 8px; }
    .flip-backward .flip-page-back { transform: rotateY(-180deg); border-radius: 0 8px 8px 0; }
    .flip-page-front canvas, .flip-page-back canvas { width: 100%; height: 100%; object-fit: contain; }
    .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 60px; background: var(--primary); border: 3px solid var(--accent); border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; z-index: 20; }
    .nav-arrow:hover:not(:disabled) { background: var(--primary-light); transform: translateY(-50%) scale(1.1); }
    .nav-arrow:disabled { opacity: 0.4; cursor: not-allowed; }
    .nav-arrow svg { width: 28px; height: 28px; }
    .nav-prev { left: 25px; }
    .nav-next { right: 25px; }
    .page-indicator { 
      position: absolute; 
      bottom: 25px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(0,0,0,0.9); 
      color: white; 
      padding: 14px 28px; 
      border-radius: 30px; 
      font-size: 1rem; 
      display: flex; 
      align-items: center; 
      gap: 18px; 
      border: 2px solid var(--accent);
      box-shadow: 0 5px 25px rgba(0,0,0,0.4);
    }
    .page-indicator strong { color: var(--accent); font-size: 1.1rem; }
    .page-indicator span { display: flex; align-items: center; gap: 5px; }
    .progress-bar { width: 100px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s ease; }
    .page-click-zone { position: absolute; top: 0; bottom: 0; width: 25%; cursor: pointer; z-index: 10; }
    .page-click-left { left: 0; }
    .page-click-right { right: 0; }
    .thumbnails-sidebar { position: fixed; right: -320px; top: 0; bottom: 0; width: 320px; background: rgba(20, 30, 50, 0.98); z-index: 300; transition: right 0.4s ease; display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,0.5); }
    .thumbnails-sidebar.open { right: 0; }
    .thumbnails-header { padding: 20px; background: var(--primary); display: flex; justify-content: space-between; align-items: center; }
    .thumbnails-header h3 { color: white; font-size: 1.1rem; }
    .close-thumbnails { background: transparent; border: none; color: white; cursor: pointer; }
    .thumbnails-grid { 
      flex: 1; 
      overflow-y: auto; 
      padding: 15px; 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 12px;
      align-content: start;
    }
    .thumbnail { 
      cursor: pointer; 
      border-radius: 6px; 
      overflow: hidden; 
      border: 3px solid transparent; 
      transition: all 0.3s ease; 
      background: white;
      display: flex;
      flex-direction: column;
    }
    .thumbnail:hover { border-color: var(--accent); transform: scale(1.05); }
    .thumbnail.active { border-color: var(--accent); box-shadow: 0 0 15px rgba(255,193,7,0.5); }
    .thumbnail canvas { 
      width: 100%; 
      height: auto;
      display: block; 
      object-fit: contain;
    }
    .thumbnail-num { 
      padding: 8px; 
      text-align: center; 
      font-size: 0.75rem; 
      font-weight: 600; 
      background: var(--gray-100); 
      color: var(--gray-800);
      border-top: 1px solid #ddd;
    }
    
    @media (max-width: 1100px) { .flipbook-page { width: 380px; height: 510px; } .page-flip-container { width: 380px; height: 510px; } .page-flip-container.flip-forward { left: calc(380px + 17px); } }
    @media (max-width: 950px) { .flipbook-page { width: 320px; height: 430px; } .page-flip-container { width: 320px; height: 430px; } .page-flip-container.flip-forward { left: calc(320px + 17px); } .header { padding: 12px 15px; } .main { padding: 15px; } .shelf-row { min-height: 260px; gap: 25px; padding: 30px 30px 50px; } }
    @media (max-width: 780px) { 
      .flipbook-page-left, .book-spine-center, .page-stack-left, .page-stack-right { display: none; } 
      .flip-backward { display: none !important; } 
      .flipbook-page { width: 90vw; max-width: 400px; height: auto; aspect-ratio: 3/4; border-radius: 8px; }
      .flipbook-page-right { border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
      .flipbook-page-right canvas { border-radius: 8px; }
      .flipbook-page-right .page-number { right: 50%; transform: translateX(50%); bottom: 15px; }
      .page-flip-container.flip-forward { left: 0; width: 90vw; max-width: 400px; height: auto; aspect-ratio: 3/4; }
      .page-flip-container .flip-page-front, .page-flip-container .flip-page-back { border-radius: 8px; }
      .header-text p { display: none; } 
      .header-text h1 { font-size: 1.1rem; } 
      .search-container { order: 3; flex: 100%; max-width: 100%; margin-top: 10px; } 
      .shelf-row { gap: 20px; min-height: 220px; padding: 25px 20px 45px; } 
      .book-front { width: 100px !important; height: 150px !important; }
      .nav-arrow { width: 50px; height: 50px; }
      .nav-prev { left: 10px; }
      .nav-next { right: 10px; }
      .page-indicator { padding: 10px 15px; font-size: 0.85rem; }
      .flipbook-container { padding: 15px 10px; }
      .reader-header { padding: 10px 15px; flex-wrap: wrap; gap: 10px; }
      .reader-title { font-size: 0.95rem; flex: 100%; }
      .reader-controls { width: 100%; justify-content: space-between; }
      .btn { padding: 8px 12px; font-size: 0.8rem; }
      .thumbnails-sidebar { width: 280px; right: -280px; }
      .thumbnails-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <div class="logo-box"><img src="https://github.com/mohamedsillahkanu/gdp-dashboard-2/raw/6c7463b0d5c3be150aafae695a4bcbbd8aeb1499/ICF-SL.jpg" alt="ICF-SL"></div>
      <div class="header-text"><h1>ICF-SL DIGITAL LIBRARY</h1><p>Driving Data-Driven Solutions for Health and Development</p></div>
    </div>
    <div class="search-container">
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="Search books or sections..." oninput="handleSearch(this.value)">
        <button class="search-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></button>
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" onclick="toggleSound()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>

  <main class="main">
    <div class="section-nav">
      <button class="section-nav-btn" id="prevSectionBtn" onclick="prevSection()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="section-tabs" id="sectionTabs"></div>
      <button class="section-nav-btn" id="nextSectionBtn" onclick="nextSection()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="section-header">
      <div class="section-icon" id="sectionIcon">📚</div>
      <div><div class="section-title" id="sectionTitle">All Books</div><div class="section-subtitle" id="sectionSubtitle">Loading...</div></div>
    </div>
    <div class="bookshelf" id="bookshelf"><div class="shelf-row"><div class="empty-shelf-message">Loading library...</div></div></div>

  <footer class="footer"><p><strong>Informatics Consultancy Firm - Sierra Leone (ICF-SL)</strong></p><p>Health Information Systems | Data Analytics | Digital Solutions</p></footer>

  <div class="reader-view" id="readerView">
    <div class="reader-header">
      <div class="reader-title" id="readerTitle">Book Title</div>
      <div class="reader-controls">
        <button class="btn btn-outline" onclick="toggleThumbnails()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Pages</button>
        <button class="btn btn-gold" onclick="closeReader()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>Close</button>
      </div>
    </div>
    <div class="flipbook-container">
      <button class="nav-arrow nav-prev" onclick="prevPage()" id="prevBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="book-3d-wrapper">
        <div class="flipbook" id="flipbook">
          <div class="page-flip-container flip-backward" id="flipBackwardContainer"><div class="flip-page-front"><canvas id="flipBackwardFront"></canvas></div><div class="flip-page-back"><canvas id="flipBackwardBack"></canvas></div></div>
          <div class="flipbook-page flipbook-page-left" id="leftPage"><div class="page-stack-left" id="pageStackLeft"></div><canvas id="leftCanvas"></canvas><div class="page-number" id="leftPageNum"></div><div class="page-click-zone page-click-left" onclick="prevPage()"></div></div>
          <div class="book-spine-center"></div>
          <div class="flipbook-page flipbook-page-right" id="rightPage"><canvas id="rightCanvas"></canvas><div class="page-number" id="rightPageNum"></div><div class="page-click-zone page-click-right" onclick="nextPage()"></div><div class="page-stack-right" id="pageStackRight"></div></div>
          <div class="page-flip-container flip-forward" id="flipForwardContainer"><div class="flip-page-front"><canvas id="flipForwardFront"></canvas></div><div class="flip-page-back"><canvas id="flipForwardBack"></canvas></div></div>
        </div>
      </div>
      <button class="nav-arrow nav-next" onclick="nextPage()" id="nextBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
      <div class="page-indicator">
        <span>Page <strong id="currentPageDisplay">1</strong> of <strong id="totalPagesDisplay">0</strong></span>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>

  <div class="thumbnails-sidebar" id="thumbnailsSidebar">
    <div class="thumbnails-header"><h3>Page Navigator</h3><button class="close-thumbnails" onclick="toggleThumbnails()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <div class="thumbnails-grid" id="thumbnailsGrid"></div>

  <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div><div class="loading-text" id="loadingText">Loading...</div></div>
  <div class="notification" id="notification"></div>

  <script>
    // ============================================
    // LIBRARY CONFIGURATION - ADD YOUR BOOKS HERE
    // ============================================
    
    const libraryData = {
      sections: [
        { id: 'all', name: 'All Books', icon: '📚', description: 'Browse all publications' },
        {
          id: 'english',
          name: 'English',
          icon: '📖',
          description: 'Language and literacy resources',
          books: [
            {
              title: 'Colouring Book for Kids',
              url: 'https://raw.githubusercontent.com/mohamedsillahkanu/book-shelf/c8b67ee6bd33025f8a9575008947d1ab97b12930/COLOURING%20BOOK%20FOR%20KIDS%20(2).pdf'
            }
          ]
        },
        { id: 'mathematics', name: 'Mathematics', icon: '📐', description: 'Math concepts and exercises', books: [] },
        { id: 'science', name: 'Science', icon: '🔬', description: 'Science and experiments', books: [] },
        { id: 'health', name: 'Health', icon: '🏥', description: 'Health education resources', books: [] },
        { id: 'technology', name: 'Technology', icon: '💻', description: 'IT and digital skills', books: [] }
      ]
    };
    
    // STATE
    let currentSectionIndex = 0, currentBooks = [], bookCovers = {}, currentBook = null, currentPdf = null;
    let currentPages = [], totalPages = 0, currentSpread = 0, isFlipping = false, thumbnailsOpen = false, soundEnabled = true;
    
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    const audioEngine = {
      ctx: null,
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
      play() {
        if (!soundEnabled || !this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        
        const now = this.ctx.currentTime;
        const duration = 0.35;
        const bufferSize = this.ctx.sampleRate * duration;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        
        // Create paper rustling sound with flap effect
        for (let i = 0; i < bufferSize; i++) {
          let noise = Math.random() * 2 - 1;
          const t = i / bufferSize;
          let envelope = t < 0.1 ? t / 0.1 : t < 0.4 ? 1.0 : 1.0 - ((t - 0.4) / 0.6);
          const flap = Math.sin(t * (25 + Math.random() * 15) * Math.PI * 2) * 0.3;
          output[i] = noise * envelope * (0.7 + flap);
        }
        
        const noiseSource = this.ctx.createBufferSource();
        noiseSource.buffer = noiseBuffer;
        
        const highPass = this.ctx.createBiquadFilter();
        highPass.type = 'highpass';
        highPass.frequency.value = 800;
        
        const lowPass = this.ctx.createBiquadFilter();
        lowPass.type = 'lowpass';
        lowPass.frequency.value = 6000;
        
        const gainNode = this.ctx.createGain();
        gainNode.gain.setValueAtTime(0.25, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + duration);
        
        noiseSource.connect(highPass);
        highPass.connect(lowPass);
        lowPass.connect(gainNode);
        gainNode.connect(this.ctx.destination);
        
        noiseSource.start(now);
        noiseSource.stop(now + duration);
        
        // Page landing thump
        setTimeout(() => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(80, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        }, 250);
      }
    };
    
    document.addEventListener('DOMContentLoaded', async () => {
      renderTabs(); await loadSection(0); updateNav();
      document.addEventListener('click', e => { if (!document.querySelector('.search-box').contains(e.target)) document.getElementById('searchResults').classList.remove('active'); });
      document.addEventListener('keydown', e => {
        if (document.getElementById('readerView').classList.contains('active')) {
          if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
          if (e.key === 'ArrowLeft') prevPage();
          if (e.key === 'Escape') closeReader();
        }
      });
      
      // Touch swipe support for mobile
      let touchStartX = 0;
      let touchEndX = 0;
      const flipbook = document.getElementById('flipbook');
      
      flipbook.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });
      
      flipbook.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) { // minimum swipe distance
          if (diff > 0) nextPage(); // swipe left = next
          else prevPage(); // swipe right = prev
        }
      }, { passive: true });
    });
    
    function renderTabs() {
      document.getElementById('sectionTabs').innerHTML = libraryData.sections.map((s, i) => 
        `<button class="section-tab ${i === 0 ? 'active' : ''}" onclick="loadSection(${i})"><span>${s.icon}</span><span>${s.name}</span><span class="tab-count">${getCount(s)}</span></button>`
      ).join('');
    }
    
    function getCount(s) { return s.id === 'all' ? libraryData.sections.reduce((n, x) => n + (x.books?.length || 0), 0) : (s.books?.length || 0); }
    
    async function loadSection(i) {
      currentSectionIndex = i;
      const s = libraryData.sections[i];
      document.querySelectorAll('.section-tab').forEach((t, j) => t.classList.toggle('active', j === i));
      document.getElementById('sectionIcon').textContent = s.icon;
      document.getElementById('sectionTitle').textContent = s.name;
      currentBooks = s.id === 'all' ? libraryData.sections.flatMap(x => (x.books || []).map(b => ({...b, sectionName: x.name, sectionIcon: x.icon}))) : (s.books || []).map(b => ({...b, sectionName: s.name, sectionIcon: s.icon}));
      document.getElementById('sectionSubtitle').textContent = `${currentBooks.length} publication${currentBooks.length !== 1 ? 's' : ''}`;
      await renderShelf(); updateNav();
    }
    
    function prevSection() { if (currentSectionIndex > 0) loadSection(currentSectionIndex - 1); }
    function nextSection() { if (currentSectionIndex < libraryData.sections.length - 1) loadSection(currentSectionIndex + 1); }
    function updateNav() { document.getElementById('prevSectionBtn').disabled = currentSectionIndex === 0; document.getElementById('nextSectionBtn').disabled = currentSectionIndex === libraryData.sections.length - 1; }
    
    function handleSearch(q) {
      if (!q.trim()) { document.getElementById('searchResults').classList.remove('active'); return; }
      const results = [], ql = q.toLowerCase();
      libraryData.sections.forEach((s, si) => {
        if (s.name.toLowerCase().includes(ql)) results.push({type: 'section', title: s.name, icon: s.icon, index: si});
        (s.books || []).forEach((b, bi) => { if (b.title.toLowerCase().includes(ql)) results.push({type: 'book', title: b.title, section: s.name, si, bi, icon: s.icon}); });
      });
      const c = document.getElementById('searchResults');
      c.innerHTML = results.length ? results.map(r => r.type === 'section' 
        ? `<div class="search-result-item" onclick="goToSection(${r.index})"><span class="result-title">${r.icon} ${r.title}</span><span class="result-type section">Section</span></div>`
        : `<div class="search-result-item" onclick="goToBook(${r.si},${r.bi})"><div class="result-title">${r.title}<span class="result-type book">Book</span></div><div class="result-section">${r.icon} ${r.section}</div></div>`
      ).join('') : `<div class="no-results">No results for "${q}"</div>`;
      c.classList.add('active');
    }
    
    function goToSection(i) { document.getElementById('searchResults').classList.remove('active'); document.getElementById('searchInput').value = ''; loadSection(i); }
    async function goToBook(si, bi) { document.getElementById('searchResults').classList.remove('active'); document.getElementById('searchInput').value = ''; await loadSection(si); setTimeout(() => openBook(bi), 300); }
    
    // Generate a nice blue cover with book title
    function generateCover(title, sectionIcon) {
      const canvas = document.createElement('canvas');
      canvas.width = 260;
      canvas.height = 380;
      const ctx = canvas.getContext('2d');
      
      // Blue gradient background
      const gradient = ctx.createLinearGradient(0, 0, 260, 380);
      gradient.addColorStop(0, '#004080');
      gradient.addColorStop(0.5, '#003366');
      gradient.addColorStop(1, '#002244');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 260, 380);
      
      // Decorative top bar
      ctx.fillStyle = '#ffc107';
      ctx.fillRect(0, 0, 260, 8);
      
      // Decorative bottom bar
      ctx.fillRect(0, 372, 260, 8);
      
      // Decorative lines
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 12; i++) {
        ctx.beginPath();
        ctx.moveTo(20, 50 + i * 25);
        ctx.lineTo(240, 50 + i * 25);
        ctx.stroke();
      }
      
      // Book icon
      ctx.font = '50px Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillText('📖', 130, 100);
      
      // Title
      ctx.fillStyle = 'white';
      ctx.font = 'bold 22px Oswald, Arial, sans-serif';
      ctx.textAlign = 'center';
      
      // Word wrap title
      const words = title.split(' ');
      const lines = [];
      let currentLine = '';
      const maxWidth = 220;
      
      for (const word of words) {
        const testLine = currentLine + (currentLine ? ' ' : '') + word;
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && currentLine) {
          lines.push(currentLine);
          currentLine = word;
        } else {
          currentLine = testLine;
        }
      }
      lines.push(currentLine);
      
      // Draw title lines centered
      const lineHeight = 30;
      const startY = 190 - ((lines.length - 1) * lineHeight) / 2;
      
      lines.forEach((line, i) => {
        ctx.fillText(line, 130, startY + i * lineHeight);
      });
      
      // Section icon at bottom
      if (sectionIcon) {
        ctx.font = '28px Arial';
        ctx.fillText(sectionIcon, 130, 340);
      }
      
      // ICF-SL text at very bottom
      ctx.font = '12px Oswald, Arial, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('ICF-SL Digital Library', 130, 362);
      
      return canvas.toDataURL('image/jpeg', 0.9);
    }
    
    async function renderShelf() {
      const shelf = document.getElementById('bookshelf');
      if (!currentBooks.length) { 
        shelf.innerHTML = `<div class="shelf-row"><div class="empty-shelf-message">No books in this section</div></div><div class="shelf-row"></div>`; 
        return; 
      }
      
      // Generate covers for all books (no loading needed - instant!)
      for (const book of currentBooks) {
        if (!bookCovers[book.title]) {
          bookCovers[book.title] = generateCover(book.title, book.sectionIcon);
        }
      }
      
      const rows = []; 
      for (let i = 0; i < currentBooks.length; i += 5) rows.push(currentBooks.slice(i, i + 5));
      while (rows.length < 2) rows.push([]);
      
      shelf.innerHTML = rows.map((row, ri) => `<div class="shelf-row">${row.map((book, bi) => {
        const cover = bookCovers[book.title];
        const gi = ri * 5 + bi;
        return `<div class="book" onclick="openBook(${gi})">
          <div class="book-front">
            <img src="${cover}" alt="${book.title}">
            <div class="book-front-overlay"></div>
          </div>
          <div class="book-pages-edge"></div>
          <div class="book-info">
            <h4>${book.title}</h4>
            <p>${book.sectionIcon} ${book.sectionName}</p>
          </div>
        </div>`;
      }).join('')}</div>`).join('');
    }
    
    // Check if mobile
    function isMobile() {
      return window.innerWidth <= 780;
    }
    
    // CORS proxy to fetch PDF when opening book
    async function fetchPdf(url) {
      const corsProxies = [
        u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
        u => 'https://corsproxy.io/?' + encodeURIComponent(u),
        u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)
      ];
      
      // Try direct first
      try {
        const res = await fetch(url);
        if (res.ok) {
          const arr = await res.arrayBuffer();
          if (arr.byteLength > 1000) return arr;
        }
      } catch (e) {}
      
      // Try proxies
      for (const proxy of corsProxies) {
        try {
          const res = await fetch(proxy(url));
          if (res.ok) {
            const arr = await res.arrayBuffer();
            if (arr.byteLength > 1000) return arr;
          }
        } catch (e) {}
      }
      
      throw new Error('Could not load PDF');
    }
    
    async function openBook(i) {
      const book = currentBooks[i]; if (!book) return;
      audioEngine.init(); showLoading('Opening book...');
      try {
        const arr = await fetchPdf(book.url);
        currentPdf = await pdfjsLib.getDocument({data: arr.slice(0)}).promise;
        totalPages = currentPdf.numPages; currentSpread = 0; mobilePageIndex = 0; currentPages = []; currentBook = book;
        for (let p = 1; p <= totalPages; p++) currentPages.push(await currentPdf.getPage(p));
        document.getElementById('readerTitle').innerHTML = `${book.title} <span>${totalPages} pages</span>`;
        document.getElementById('totalPagesDisplay').textContent = totalPages;
        await genThumbs(); await renderSpread(); updateStacks();
        document.getElementById('readerView').classList.add('active'); hideLoading();
      } catch (e) { console.error('Error:', e); hideLoading(); showNotification('Error loading book. Check the URL.', 'error'); }
    }
    
    function getVT() { return totalPages + 2 + (totalPages % 2); }
    function v2a(v) {
      if (v === 0) return -1; // blank before cover
      if (v >= 1 && v <= totalPages) return v - 1; // actual pages (1 to N maps to 0 to N-1)
      return -1; // blank padding at end
    }
    function getMS() { return (getVT() / 2) - 1; }
    
    async function renderPage(page, canvas) { const vp = page.getViewport({scale: 1.5}); canvas.width = vp.width; canvas.height = vp.height; await page.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise; }
    function renderBlank(canvas) { canvas.width = 480; canvas.height = 640; canvas.getContext('2d').fillStyle = '#f8f8f8'; canvas.getContext('2d').fillRect(0, 0, 480, 640); }
    
    // Mobile uses single page view (currentSpread = page index directly)
    let mobilePageIndex = 0;
    
    async function renderSpread() {
      const lc = document.getElementById('leftCanvas'), rc = document.getElementById('rightCanvas');
      const ln = document.getElementById('leftPageNum'), rn = document.getElementById('rightPageNum');
      
      if (isMobile()) {
        // Mobile: single page view - show one page at a time
        const pageIdx = mobilePageIndex;
        if (pageIdx >= 0 && pageIdx < totalPages) {
          await renderPage(currentPages[pageIdx], rc);
          rn.textContent = pageIdx + 1;
          rn.style.display = 'block';
        } else {
          renderBlank(rc);
          rn.style.display = 'none';
        }
        document.getElementById('currentPageDisplay').textContent = pageIdx === 0 ? 'Cover' : pageIdx + 1;
        document.getElementById('progressFill').style.width = `${((pageIdx + 1) / totalPages) * 100}%`;
        document.getElementById('prevBtn').disabled = mobilePageIndex === 0;
        document.getElementById('nextBtn').disabled = mobilePageIndex >= totalPages - 1;
        updateActiveThumbnail();
        return;
      }
      
      // Desktop: spread view
      const li = v2a(currentSpread * 2), ri = v2a(currentSpread * 2 + 1);
      if (li >= 0 && li < totalPages) { await renderPage(currentPages[li], lc); ln.textContent = li + 1; ln.style.display = 'block'; } else { renderBlank(lc); ln.style.display = 'none'; }
      if (ri >= 0 && ri < totalPages) { await renderPage(currentPages[ri], rc); rn.textContent = ri + 1; rn.style.display = 'block'; } else { renderBlank(rc); rn.style.display = 'none'; }
      
      // Update page display
      let displayPage = '';
      if (currentSpread === 0) {
        displayPage = 'Cover';
      } else if (li >= 0 && ri >= 0) {
        displayPage = `${li + 1} - ${ri + 1}`;
      } else if (li >= 0) {
        displayPage = `${li + 1}`;
      } else if (ri >= 0) {
        displayPage = `${ri + 1}`;
      }
      document.getElementById('currentPageDisplay').textContent = displayPage;
      document.getElementById('progressFill').style.width = `${Math.min(100, ((Math.max(li, ri) + 1) / totalPages) * 100)}%`;
      document.getElementById('prevBtn').disabled = currentSpread === 0;
      document.getElementById('nextBtn').disabled = currentSpread >= getMS();
      updateActiveThumbnail(); updateStacks();
    }
    
    function updateStacks() {
      let pl = 0, pr = 0;
      for (let v = 0; v < currentSpread * 2; v++) if (v2a(v) >= 0) pl++;
      for (let v = currentSpread * 2 + 2; v < getVT(); v++) if (v2a(v) >= 0) pr++;
      const ls = document.getElementById('pageStackLeft'), rs = document.getElementById('pageStackRight');
      const lw = Math.min(pl * 2, 80), rw = Math.min(pr * 2, 80);
      ls.style.width = lw + 'px'; rs.style.width = rw + 'px';
      ls.innerHTML = pl > 0 ? `<div class="stack-edge stack-edge-left" style="width:${lw}px"></div>` : '';
      rs.innerHTML = pr > 0 ? `<div class="stack-edge stack-edge-right" style="width:${rw}px"></div>` : '';
    }
    
    async function nextPage() {
      if (isFlipping) return;
      
      if (isMobile()) {
        // Mobile: single page navigation
        if (mobilePageIndex >= totalPages - 1) return;
        isFlipping = true; audioEngine.play();
        const fc = document.getElementById('flipForwardContainer'), ff = document.getElementById('flipForwardFront'), fb = document.getElementById('flipForwardBack');
        await renderPage(currentPages[mobilePageIndex], ff);
        if (mobilePageIndex + 1 < totalPages) await renderPage(currentPages[mobilePageIndex + 1], fb); else renderBlank(fb);
        fc.classList.add('flipping-forward');
        setTimeout(async () => { fc.classList.remove('flipping-forward'); mobilePageIndex++; await renderSpread(); isFlipping = false; }, 600);
        return;
      }
      
      // Desktop: spread navigation
      if (currentSpread >= getMS()) return;
      isFlipping = true; audioEngine.play();
      const fc = document.getElementById('flipForwardContainer'), ff = document.getElementById('flipForwardFront'), fb = document.getElementById('flipForwardBack');
      const ri = v2a(currentSpread * 2 + 1), nli = v2a((currentSpread + 1) * 2);
      if (ri >= 0) await renderPage(currentPages[ri], ff); else renderBlank(ff);
      if (nli >= 0) await renderPage(currentPages[nli], fb); else renderBlank(fb);
      fc.classList.add('flipping-forward');
      setTimeout(async () => { fc.classList.remove('flipping-forward'); currentSpread++; await renderSpread(); isFlipping = false; }, 600);
    }
    
    async function prevPage() {
      if (isFlipping) return;
      
      if (isMobile()) {
        // Mobile: single page navigation
        if (mobilePageIndex <= 0) return;
        isFlipping = true; audioEngine.play();
        const fc = document.getElementById('flipForwardContainer'), ff = document.getElementById('flipForwardFront'), fb = document.getElementById('flipForwardBack');
        await renderPage(currentPages[mobilePageIndex], ff);
        await renderPage(currentPages[mobilePageIndex - 1], fb);
        fc.style.transform = 'rotateY(-180deg)';
        fc.style.display = 'block';
        fc.style.animation = 'none';
        setTimeout(() => {
          fc.style.transition = 'transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1)';
          fc.style.transform = 'rotateY(0deg)';
        }, 10);
        setTimeout(async () => { 
          fc.style.display = 'none';
          fc.style.transition = '';
          fc.style.transform = '';
          mobilePageIndex--; 
          await renderSpread(); 
          isFlipping = false; 
        }, 610);
        return;
      }
      
      // Desktop: spread navigation
      if (currentSpread === 0) return;
      isFlipping = true; audioEngine.play();
      const fc = document.getElementById('flipBackwardContainer'), ff = document.getElementById('flipBackwardFront'), fb = document.getElementById('flipBackwardBack');
      const li = v2a(currentSpread * 2), pri = v2a((currentSpread - 1) * 2 + 1);
      if (li >= 0) await renderPage(currentPages[li], ff); else renderBlank(ff);
      if (pri >= 0) await renderPage(currentPages[pri], fb); else renderBlank(fb);
      fc.classList.add('flipping-backward');
      setTimeout(async () => { fc.classList.remove('flipping-backward'); currentSpread--; await renderSpread(); isFlipping = false; }, 600);
    }
    
    async function goToPage(pi) {
      if (isFlipping) return;
      audioEngine.play();
      if (isMobile()) {
        mobilePageIndex = pi;
        await renderSpread();
      } else {
        for (let s = 0; s <= getMS(); s++) { if (v2a(s * 2) === pi || v2a(s * 2 + 1) === pi) { currentSpread = s; await renderSpread(); break; } }
      }
      toggleThumbnails();
    }
    
    async function genThumbs() {
      const g = document.getElementById('thumbnailsGrid'); g.innerHTML = '';
      for (let i = 0; i < totalPages; i++) {
        const t = document.createElement('div'); t.className = 'thumbnail'; t.onclick = () => goToPage(i);
        const c = document.createElement('canvas'), p = currentPages[i];
        
        // Calculate scale to fit thumbnail width while maintaining aspect ratio
        const desiredWidth = 130;
        const originalViewport = p.getViewport({scale: 1});
        const scale = desiredWidth / originalViewport.width;
        const vp = p.getViewport({scale: scale});
        
        c.width = vp.width; 
        c.height = vp.height;
        await p.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
        
        const l = document.createElement('div'); 
        l.className = 'thumbnail-num'; 
        l.textContent = i === 0 ? 'Cover' : `Page ${i + 1}`;
        
        t.appendChild(c); 
        t.appendChild(l); 
        g.appendChild(t);
      }
    }
    
    function updateActiveThumbnail() { 
      if (isMobile()) {
        document.querySelectorAll('.thumbnail').forEach((t, i) => t.classList.toggle('active', i === mobilePageIndex));
      } else {
        document.querySelectorAll('.thumbnail').forEach((t, i) => t.classList.toggle('active', i === v2a(currentSpread * 2) || i === v2a(currentSpread * 2 + 1))); 
      }
    }
    function closeReader() { document.getElementById('readerView').classList.remove('active'); document.getElementById('thumbnailsSidebar').classList.remove('open'); thumbnailsOpen = false; }
    function toggleThumbnails() { thumbnailsOpen = !thumbnailsOpen; document.getElementById('thumbnailsSidebar').classList.toggle('open', thumbnailsOpen); }
    function toggleSound() { soundEnabled = !soundEnabled; document.getElementById('soundLabel').textContent = soundEnabled ? 'Sound' : 'Muted'; }
    function showLoading(t) { document.getElementById('loadingText').textContent = t; document.getElementById('loadingOverlay').classList.add('active'); }
    function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }
    function showNotification(m, type = 'info') { const n = document.getElementById('notification'); n.textContent = m; n.className = `notification ${type} show`; setTimeout(() => n.classList.remove('show'), 3000); }
  </script>
</body>
